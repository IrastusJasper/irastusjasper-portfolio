<div class="container">
  <div class="contact-container" data-aos="fade-up">
    <h2 data-aos="fade-down">📬 Contact Me</h2>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <input
          type="text"
          placeholder="Your Name"
          formControlName="name"
          [class.invalid]="submitted && contactForm.get('name')?.invalid"
        />
        <div *ngIf="submitted && contactForm.get('name')?.invalid" class="error">
          Name is required.
        </div>
      </div>

      <div class="form-group">
        <input
          type="email"
          placeholder="Your Email"
          formControlName="email"
          [class.invalid]="submitted && contactForm.get('email')?.invalid"
        />
        <div *ngIf="submitted && contactForm.get('email')?.invalid" class="error">
          Enter a valid email.
        </div>
      </div>

      <div class="form-group">
        <textarea
          rows="5"
          placeholder="Your Message"
          formControlName="message"
          [class.invalid]="submitted && contactForm.get('message')?.invalid"
        ></textarea>
        <div *ngIf="submitted && contactForm.get('message')?.invalid" class="error">
          Message must be at least 10 characters.
        </div>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </div>
</div>
