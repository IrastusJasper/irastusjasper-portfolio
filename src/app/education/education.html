<div class="container">
  <div class="education-container" data-aos="fade-up">
  <h2 data-aos="fade-down">Education</h2>

  <div class="timeline">
    <div
      class="timeline-item"
      *ngFor="let edu of educationList"
      data-aos="fade-up"
    >
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <h3>{{ edu.degree }}</h3>
        <h4>{{ edu.institution }}</h4>
        <span>{{ edu.year }}</span>
        <p>A comprehensive educational program building expertise in modern technologies and industry best practices.</p>
      </div>
    </div>
  </div>
</div>

</div>
